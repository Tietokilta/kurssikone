services:
  backend:
    container_name: backend
    image: ghcr.io/otju/sisu-course-reviewer-backend:latest
    restart: 'always'
    env_file:
      - .env
    depends_on:
      database:
        condition: service_healthy

  database:
    container_name: database
    image: postgres:14.1
    restart: 'always'
    env_file:
      - .env
    volumes:
      - ./db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $POSTGRES_USER -d $POSTGRES_DB']
      interval: 3s
      start_period: 30s

  watchtower:
    container_name: watchtower
    image: containrrr/watchtower
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./watchtower_config.json:/config.json
    command: --interval 60 --cleanup backend

  nginx:
    container_name: nginx
    image: nginx:latest
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - $SSL_PRIVATE_KEY_PATH:/etc/nginx/key.pem
      - $SSL_CERTIFICATE_FULL_CHAIN_PATH:/etc/nginx/cert.pem
    depends_on:
      - backend
    ports:
      - 443:443
