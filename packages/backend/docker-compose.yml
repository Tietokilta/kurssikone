services:
  backend:
    container_name: dev_backend
    build:
      context: ../..
      dockerfile: packages/backend/Dockerfile
      target: builder

    command: npm run dev
    working_dir: /app/packages/backend

    restart: unless-stopped
    environment:
      - ALLOW_RESET=true
    volumes:
      - ./src/:/app/packages/backend/src/:Z
    ports:
      - $PORT:$PORT
    env_file:
      - .env
    depends_on:
      database:
        condition: service_healthy

  database:
    container_name: dev_database
    image: postgres:14.1
    restart: 'no'
    ports:
      - '5432:5432'
    env_file:
      - .env
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $POSTGRES_USER -d $POSTGRES_DB']
      interval: 3s
      start_period: 30s
