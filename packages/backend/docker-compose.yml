services:
  backend:
    container_name: dev_backend
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - ALLOW_RESET=true
    volumes:
      - ./src/:/usr/src/app/src/
    ports:
      - $PORT:$PORT
    env_file:
      - .env
    depends_on:
      database:
        condition: service_healthy

  database:
    container_name: dev_database
    image: postgres:14.1
    restart: 'no'
    ports:
      - '5432:5432'
    env_file:
      - .env
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $POSTGRES_USER -d $POSTGRES_DB']
      interval: 3s
      start_period: 30s

  pgadmin:
    container_name: dev_pgadmin4
    image: dpage/pgadmin4
    restart: 'no'
    environment:
      PGADMIN_DEFAULT_EMAIL: $PGADMIN_DEFAULT_EMAIL
      PGADMIN_DEFAULT_PASSWORD: $PGADMIN_DEFAULT_PASSWORD
    ports:
      - '5050:80'
    depends_on:
      database:
        condition: service_healthy
